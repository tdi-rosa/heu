<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf0e4">
  <meta name="description" content="Un petit monde à partager. Entrez, promenez-vous, retrouvez-vous.">
  <title>heu — un petit monde</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23edf0e4'/%3E%3Cpath d='M10 8h12v10H10z' fill='%2367412f'/%3E%3Cpath d='M12 13h8v7h-8z' fill='%23edba8e'/%3E%3Cpath d='M9 20h14v8H9z' fill='%23cf7757'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="world" aria-label="Monde partagé en vue du dessus. Déplacez-vous avec les flèches ou ZQSD."></canvas>
  <header class="topbar">
    <div class="brand">heu<span>un petit monde</span></div>
    <div class="presence"><i id="connection-dot"></i><span id="status" role="status" aria-live="polite">Connexion…</span><span class="divider"></span><span id="count">0 ici</span></div>
  </header>
  <footer class="bottom"><span id="hint">ZQSD / WASD / flèches · pour se promener</span><button id="rename" type="button" aria-label="Changer de pseudo"></button></footer>
  <div id="joystick" aria-label="Joystick de déplacement"><div id="stick"></div></div>
  <dialog id="join">
    <form id="join-form">
      <span class="eyebrow">BIENVENUE DEHORS</span>
      <h1>On se retrouve ici.</h1>
      <p>Un petit monde. Vous, et les autres.</p>
      <label for="nickname">Comment on vous appelle ?</label>
      <input id="nickname" name="nickname" maxlength="20" autocomplete="nickname" placeholder="Votre pseudo" required>
      <button class="enter" type="submit">Entrer dans le monde <span aria-hidden="true">↗</span></button>
      <small>Sans compte. Votre pseudo reste sur ce navigateur.</small>
    </form>
  </dialog>
  <script type="module" src="/game.js"></script>
</body>
</html>
